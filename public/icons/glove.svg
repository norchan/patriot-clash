<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Boxing glove -->
  <!-- Main glove body -->
  <ellipse cx="140" cy="120" rx="50" ry="60" fill="#dc2626"/>

  <!-- Padding lines on glove -->
  <line x1="120" y1="100" x2="160" y2="100" stroke="#991b1b" stroke-width="2"/>
  <line x1="110" y1="130" x2="170" y2="130" stroke="#991b1b" stroke-width="2"/>
  <line x1="120" y1="160" x2="160" y2="160" stroke="#991b1b" stroke-width="2"/>

  <!-- Wrist cuff -->
  <rect x="100" y="170" width="80" height="60" rx="8" fill="#b91c1c"/>

  <!-- Cuff straps -->
  <line x1="100" y1="180" x2="180" y2="180" stroke="#991b1b" stroke-width="1.5"/>
  <line x1="100" y1="195" x2="180" y2="195" stroke="#991b1b" stroke-width="1.5"/>
  <line x1="100" y1="210" x2="180" y2="210" stroke="#991b1b" stroke-width="1.5"/>

  <!-- Highlight/shine -->
  <ellipse cx="150" cy="100" rx="15" ry="25" fill="#ef4444" opacity="0.6"/>
</svg>
